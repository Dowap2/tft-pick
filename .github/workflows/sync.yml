# 매일 KST 06:00 정적 데이터 갱신 (docs/티어기준.md §8)
#   cdragon/metatft 스냅샷 갱신 (lib/gen) + 이미지 → 변경 시 커밋 → Cloudflare Workers Builds 가 재배포
#   매치 수집·클러스터링은 collect.yml 이 3시간마다 상시로 돈다.
name: sync-data
on:
  schedule:
    - cron: "0 21 * * *"   # UTC 21:00 = KST 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      # ---- 1) 정적 데이터 (cdragon, metatft) ----
      - run: npm run sync
      - run: npm run sync:meta
      - run: node scripts/build-images.mjs      # 새 유닛/아이템 이미지만 추가 생성
      - name: Commit lib/gen if changed
        run: |
          git config user.name "tft-pick-bot"
          git config user.email "bot@users.noreply.github.com"
          git add lib/gen public/img
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: $(date -u +%Y-%m-%d) 자동 갱신 (patch $(node -p "require('./lib/gen/meta.json').patch"))"
          git push

      # ---- 매치 수집·정제는 collect.yml (3시간마다 상시) 담당 ----
